<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CompareText - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(135deg, #f5f7fc 0%, #eef2ff 100%);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .offline-card {
      background: white;
      border-radius: 48px;
      padding: 48px 32px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      border: 1px solid rgba(37,99,235,0.2);
    }
    .offline-icon {
      font-size: 80px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.8rem;
      color: #1e293b;
      margin-bottom: 16px;
    }
    p {
      color: #64748b;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .retry-btn {
      background: linear-gradient(95deg, #1e40af, #3b82f6);
      border: none;
      padding: 12px 32px;
      border-radius: 80px;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }
    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(59,130,246,0.3);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">📡</div>
    <h1>You're Offline</h1>
    <p>CompareText needs an internet connection to work. Please check your connection and try again.</p>
    <button class="retry-btn" onclick="location.reload()">⟳ Try Again</button>
  </div>
</body>
</html>
